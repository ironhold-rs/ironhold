[package]
name = "ironhold-db"
description = "Database support for the Ironhold web framework: SQLite and Postgres with secure, fast defaults"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# SQLite compiled into the binary. Loading native SQLite extensions at runtime
# is deliberately not enabled (smaller attack surface).
sqlite = ["sqlx/sqlite-bundled"]
# Postgres, with TLS through rustls (no OpenSSL dependency).
postgres = ["sqlx/postgres", "sqlx/tls-rustls-ring-webpki"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
ironhold-core.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower-sessions.workspace = true
tracing.workspace = true

[dev-dependencies]
getrandom.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
