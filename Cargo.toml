[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ironhold-rs/ironhold"
homepage = "https://github.com/ironhold-rs/ironhold"
authors = ["The Ironhold Contributors"]
keywords = ["web", "framework", "http", "security", "fullstack"]
categories = ["web-programming::http-server"]

[workspace.dependencies]
# Internal crates
ironhold = { path = "crates/ironhold", version = "0.1.0" }
ironhold-db = { path = "crates/ironhold-db", version = "0.1.0" }
ironhold-auth = { path = "crates/ironhold-auth", version = "0.1.0" }
ironhold-core = { path = "crates/ironhold-core", version = "0.1.0" }
ironhold-html = { path = "crates/ironhold-html", version = "0.1.0" }
ironhold-forms = { path = "crates/ironhold-forms", version = "0.1.0" }
ironhold-security = { path = "crates/ironhold-security", version = "0.1.0" }
ironhold-session = { path = "crates/ironhold-session", version = "0.1.0" }

# External crates
argon2 = "0.6"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
http-body-util = "0.1"
maud = { version = "0.27", features = ["axum"] }
notify-debouncer-mini = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["limit", "load-shed", "util"] }
tower-sessions = "0.15"
tower-http = { version = "0.7", features = ["catch-panic", "limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Reliability: framework code must not crash the server. Return errors instead.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Release builds of the examples and benchmarks. Apps generated by
# `ironhold new` get the same settings. `panic` stays "unwind" so a bug in
# one request becomes a 500 response instead of taking the whole server down.
[profile.release]
lto = "thin"
codegen-units = 1

# Password hashing is deliberately expensive; unoptimised it takes seconds,
# which makes logins painfully slow in development and tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
